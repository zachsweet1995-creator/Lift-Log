const KEY_ALIASES = {

function canonicalKey(name){const k=exerciseKey(name);return KEY_ALIASES[k]||k;}

function latestExercise(name,fromDate=selectedDate){const k=canonicalKey(name);for(const date of Object.keys(data.days).filter(d=>d<fromDate).sort().reverse()){const ex=(data.days[date].exercises||[]).find(e=>canonicalKey(e.name)===k);if(ex)return ex;}return null;}

  const actualW=positiveNumber(prev.weight),actualR=repNumber(prev.reps);

  if(goalW===null&&rawGoal){const repeat=goalR??actualR??'';const met=rawActual.toLowerCase()===rawGoal.toLowerCase()&&goalR!==null&&actualR!==null&&actualR>=goalR;return {weight:rawGoal,reps:met&&goalR<12?goalR+1:repeat};}
  if(actualW===null||actualR===null)return {weight:goalW??rawActual,reps:goalR??actualR??''};

function ensureV4(){
  data.customExercises=Array.isArray(data.customExercises)?data.customExercises:[];
  data.customFoods=Array.isArray(data.customFoods)?data.customFoods:[];
  data.savedMeals=Array.isArray(data.savedMeals)?data.savedMeals:[];
  data.savedSupersets=Array.isArray(data.savedSupersets)?data.savedSupersets:[];
  data.preferences=data.preferences&&typeof data.preferences==='object'?data.preferences:{};
  if(!Number.isFinite(Number(data.preferences.restSeconds)))data.preferences.restSeconds=90;
  if(data.preferences.autoRest===undefined)data.preferences.autoRest=false;
  if(!Array.isArray(data.favorites))data.favorites=[];
}
ensureV4();

function foodKey(value){return String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function addFoodRecord(food,kind='',quantity=1){const day=currentDay(true);const factor=Number(quantity);if(!Number.isFinite(factor)||factor<=0||factor>20){toast('Choose a serving between 0 and 20');return false;}
  const record={id:uid(),name:String(food.name||food.detail||'Saved meal'),meal:kind||food.meal||'Meal',time:kind||food.time||'Meal',estimated:food.estimated!==false,calories:0,protein:0,carbs:0,fat:0};
  for(const k of ['calories','protein','carbs','fat'])record[k]=Math.round(n(food[k])*factor*10)/10;
  day.foods.push(record);delete day.nutritionOverride;store();render();toast(`Logged ${record.name}`);return true;
}
function foodCatalog(){const counts=new Map();for(const [date,day] of Object.entries(data.days))for(const food of day.foods||[]){const k=foodKey(food.name);const h=counts.get(k)||{count:0,last:''};h.count++;if(date>h.last)h.last=date;counts.set(k,h);}

 <div class="card margin-top"><div class="section-heading"><h2>Nutrition trends</h2><span class="chip muted">Recent logged days</span></div><div class="v4-snapshot"><div class="snapshot-pill"><span>AVG PROTEIN</span><strong>${fmt(avgP)}g</strong><small>Last ${week.length} logged day${week.length===1?'':'s'}</small></div><div class="snapshot-pill"><span>PROTEIN LEFT TODAY</span><strong>${fmt(Math.max(0,tg.protein-t.protein))}g</strong><small>Compared with target</small></div></div>${week.length?chartSvg(week.map(x=>({date:x.date,value:x.protein})),'g protein'):'<div class="empty">Log a few meals to show your trends.</div>'}</div><div class="footer-note">You can edit saved foods, portions and estimates. All data stays on this device until exported.</div>`;
}

function attach(){document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.tab)));byId('settingsButton').addEventListener('click',settingsModal);byId('prevDay').addEventListener('click',()=>adjustDate(-1));byId('nextDay').addEventListener('click',()=>adjustDate(1));byId('datePicker').addEventListener('change',handleChange);document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',event=>{if(event.target.id==='exerciseSearch')exerciseResultRows();if(event.target.id==='mealSearch'){mealQuery=event.target.value;updateMealSearch();}});document.addEventListener('submit',handleSubmit);byId('backupFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{const text=await file.text();const newData=JSON.parse(text);if(!newData||newData.version!==1||!newData.days||!newData.targets||!Array.isArray(newData.favorites)||Object.keys(newData.days).some(k=>!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(k)||!Array.isArray(newData.days[k].foods)||!Array.isArray(newData.days[k].exercises))){throw Error('Invalid backup file');}if(confirm('Restore this LiftLog backup? Your current phone data will be replaced.')){data=newData;data.customExercises=Array.isArray(data.customExercises)?data.customExercises:[];ensureV4();store();render();toast('Backup restored');}}catch(e){toast('This is not a valid LiftLog backup.');}event.target.value='';});byId('modal').addEventListener('click',e=>{if(e.target===byId('modal'))closeModal();});}
attach();render();
</script>
</body>
</html>
